<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی حدس عدد شانس</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Vazirmatn Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library for Victory Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    animation: {
                        'bounce-short': 'bounce 0.5s ease-in-out 1',
                        'shake': 'shake 0.4s ease-in-out',
                        'pulse-glow': 'pulseGlow 2s infinite',
                    },
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '20%, 60%': { transform: 'translateX(-8px)' },
                            '40%, 80%': { transform: 'translateX(8px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(14, 165, 233, 0.4)' },
                            '50%': { boxShadow: '0 0 30px rgba(14, 165, 233, 0.8)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for game history */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.5);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 selection:bg-brand-500 selection:text-white">

    <!-- Header / Title -->
    <header class="w-full max-w-md text-center pt-2 pb-4">
        <div class="inline-flex items-center justify-center p-3 bg-brand-500/10 rounded-2xl border border-brand-500/20 mb-2 backdrop-blur-md">
            <i class="fa-solid fa-gamepad text-brand-500 text-2xl ml-2"></i>
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-brand-500">
                چالش حدس عدد
            </h1>
        </div>
        <p class="text-xs text-slate-400">عدد مخفی رو حدس بزن و حدس‌هات رو مدیریت کن!</p>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-5 shadow-2xl flex flex-col gap-5 my-auto">
        
        <!-- Scoreboard & Stats -->
        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-900/60 p-2.5 rounded-2xl border border-slate-700/40">
                <span class="block text-[10px] text-slate-400 font-medium">سطح سختی</span>
                <span id="difficulty-display" class="text-sm font-bold text-amber-400">ساده</span>
            </div>
            <div class="bg-slate-900/60 p-2.5 rounded-2xl border border-slate-700/40">
                <span class="block text-[10px] text-slate-400 font-medium">فرصت باقی‌مانده</span>
                <span id="attempts-left" class="text-lg font-extrabold text-brand-500">۱۰</span>
            </div>
            <div class="bg-slate-900/60 p-2.5 rounded-2xl border border-slate-700/40">
                <span class="block text-[10px] text-slate-400 font-medium">امتیاز کل</span>
                <span id="total-score" class="text-lg font-extrabold text-emerald-400">۰</span>
            </div>
        </div>

        <!-- Range Selection Buttons -->
        <div class="space-y-1.5">
            <label class="text-xs font-semibold text-slate-300 block">بازه عدد را انتخاب کنید:</label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" data-range="50" data-attempts="10" class="range-btn py-2 px-2 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-600 text-xs font-bold transition-all duration-200 focus:outline-none">
                    ۱ تا ۵۰
                </button>
                <button type="button" data-range="100" data-attempts="8" class="range-btn active py-2 px-2 rounded-xl border-2 border-brand-500 bg-brand-500/20 text-brand-500 text-xs font-bold transition-all duration-200 focus:outline-none">
                    ۱ تا ۱۰۰
                </button>
                <button type="button" data-range="500" data-attempts="6" class="range-btn py-2 px-2 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-600 text-xs font-bold transition-all duration-200 focus:outline-none">
                    ۱ تا ۵۰۰
                </button>
            </div>
        </div>

        <!-- Feedback Banner -->
        <div id="feedback-card" class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4 text-center transition-all duration-300 flex flex-col items-center justify-center min-h-[90px]">
            <div id="feedback-icon" class="text-2xl mb-1 text-slate-400">
                <i class="fa-solid fa-circle-question"></i>
            </div>
            <p id="feedback-text" class="text-sm font-semibold text-slate-200">
                یک عدد بین <span id="min-range-text" class="text-brand-500">۱</span> تا <span id="max-range-text" class="text-brand-500">۱۰۰</span> حدس بزنید!
            </p>
        </div>

        <!-- Number Input & Quick Adjusters -->
        <div id="input-container" class="space-y-3">
            <div class="relative flex items-center justify-center">
                <!-- Minus Button -->
                <button id="decrement-btn" type="button" class="absolute right-2 w-11 h-11 bg-slate-700 active:bg-slate-600 rounded-xl flex items-center justify-center text-xl text-slate-200 shadow-md touch-manipulation">
                    <i class="fa-solid fa-minus"></i>
                </button>
                
                <input id="guess-input" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="؟" class="w-full bg-slate-900 border-2 border-slate-700 focus:border-brand-500 text-slate-100 text-center text-2xl font-black py-3 px-14 rounded-2xl outline-none transition-all placeholder:text-slate-600 shadow-inner">
                
                <!-- Plus Button -->
                <button id="increment-btn" type="button" class="absolute left-2 w-11 h-11 bg-slate-700 active:bg-slate-600 rounded-xl flex items-center justify-center text-xl text-slate-200 shadow-md touch-manipulation">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Submit Guess Button -->
            <button id="submit-btn" type="button" class="w-full py-3.5 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-brand-500/25 transition-all text-base flex items-center justify-center gap-2 touch-manipulation">
                <span>ثبت حدس</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>

        <!-- Restart / New Game Button (Hidden by default or available always) -->
        <button id="reset-btn" type="button" class="w-full py-2.5 bg-slate-700/60 hover:bg-slate-700 active:bg-slate-600 text-slate-300 font-semibold rounded-xl transition-all text-xs flex items-center justify-center gap-2">
            <i class="fa-solid fa-rotate-right"></i>
            <span>شروع مجدد بازی</span>
        </button>

        <!-- Guess History Log -->
        <div class="space-y-1.5">
            <div class="flex justify-between items-center text-xs text-slate-400 px-1">
                <span>تاریخچه حدس‌ها</span>
                <span id="history-count" class="text-[10px] bg-slate-700 px-2 py-0.5 rounded-full">۰ حدس</span>
            </div>
            <div id="history-list" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto p-1 bg-slate-900/40 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-500 italic p-1 w-full text-center">هنوز حدسی ثبت نشده</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center pt-4 pb-2 text-[11px] text-slate-500">
        طراحی شده برای GitHub Pages | اجرا روی موبایل و دسکتاپ
    </footer>

    <!-- Game Logic JavaScript -->
    <script>
        // Game State Variables
        let maxRange = 100;
        let maxAttempts = 8;
        let attemptsLeft = maxAttempts;
        let targetNumber = 0;
        let isGameOver = false;
        let totalScore = 0;
        let guessHistory = [];

        // DOM Elements
        const guessInput = document.getElementById('guess-input');
        const submitBtn = document.getElementById('submit-btn');
        const resetBtn = document.getElementById('reset-btn');
        const incrementBtn = document.getElementById('increment-btn');
        const decrementBtn = document.getElementById('decrement-btn');
        const attemptsLeftDisplay = document.getElementById('attempts-left');
        const totalScoreDisplay = document.getElementById('total-score');
        const difficultyDisplay = document.getElementById('difficulty-display');
        const feedbackCard = document.getElementById('feedback-card');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const minRangeText = document.getElementById('min-range-text');
        const maxRangeText = document.getElementById('max-range-text');
        const historyList = document.getElementById('history-list');
        const historyCount = document.getElementById('history-count');
        const rangeBtns = document.querySelectorAll('.range-btn');

        // Audio Effects using Web Audio API (No external assets needed)
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } else if (type === 'lose') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch (e) {
                // Audio Context might be blocked or not supported
            }
        };

        // Initialize Game
        function initGame() {
            targetNumber = Math.floor(Math.random() * maxRange) + 1;
            attemptsLeft = maxAttempts;
            isGameOver = false;
            guessHistory = [];

            // Reset UI
            attemptsLeftDisplay.textContent = attemptsLeft;
            guessInput.value = '';
            guessInput.disabled = false;
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            minRangeText.textContent = '۱';
            maxRangeText.textContent = maxRange;

            feedbackCard.className = "bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4 text-center transition-all duration-300 flex flex-col items-center justify-center min-h-[90px]";
            feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-question text-slate-400"></i>';
            feedbackText.innerHTML = `یک عدد بین <span class="text-brand-500 font-bold">۱</span> تا <span class="text-brand-500 font-bold">${maxRange}</span> حدس بزنید!`;

            renderHistory();
        }

        // Handle Guess Submission
        function handleGuess() {
            if (isGameOver) return;

            const userGuess = parseInt(guessInput.value);

            // Validation
            if (isNaN(userGuess) || userGuess < 1 || userGuess > maxRange) {
                feedbackCard.classList.add('animate-shake');
                setTimeout(() => feedbackCard.classList.remove('animate-shake'), 400);
                
                feedbackIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>';
                feedbackText.textContent = `لطفاً عددی بین ۱ تا ${maxRange} وارد کنید!`;
                return;
            }

            // Deduct attempt
            attemptsLeft--;
            attemptsLeftDisplay.textContent = attemptsLeft;

            // Save History
            let status = 'equal';
            if (userGuess < targetNumber) status = 'low';
            else if (userGuess > targetNumber) status = 'high';

            guessHistory.push({ guess: userGuess, status: status });
            renderHistory();

            // Check Game Outcome
            if (userGuess === targetNumber) {
                // VICTORY
                isGameOver = true;
                const earnedPoints = attemptsLeft * 10 + (maxRange / 10);
                totalScore += earnedPoints;
                totalScoreDisplay.textContent = totalScore;

                playSound('win');
                triggerConfetti();

                feedbackCard.className = "bg-emerald-500/20 border border-emerald-500/50 rounded-2xl p-4 text-center transition-all duration-300 flex flex-col items-center justify-center min-h-[90px] animate-bounce-short";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-trophy text-amber-400 text-3xl mb-1"></i>';
                feedbackText.innerHTML = `<span class="text-emerald-400 font-bold text-lg">تبریک! درست حدس زدید! 🎉</span><br><span class="text-xs text-slate-300">عدد مخفی ${targetNumber} بود (+${earnedPoints} امتیاز)</span>`;

                disableInput();
            } else if (attemptsLeft <= 0) {
                // GAME OVER
                isGameOver = true;
                playSound('lose');

                feedbackCard.className = "bg-rose-500/20 border border-rose-500/50 rounded-2xl p-4 text-center transition-all duration-300 flex flex-col items-center justify-center min-h-[90px] animate-shake";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-face-frown text-rose-400 text-3xl mb-1"></i>';
                feedbackText.innerHTML = `<span class="text-rose-400 font-bold text-lg">فرصت شما تمام شد! 😞</span><br><span class="text-xs text-slate-300">عدد صحیح <strong class="text-white">${targetNumber}</strong> بود.</span>`;

                disableInput();
            } else {
                // WRONG GUESS (Higher/Lower)
                playSound('click');
                feedbackCard.classList.add('animate-bounce-short');
                setTimeout(() => feedbackCard.classList.remove('animate-bounce-short'), 500);

                if (userGuess < targetNumber) {
                    feedbackCard.className = "bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 text-center transition-all duration-300 flex flex-col items-center justify-center min-h-[90px]";
                    feedbackIcon.innerHTML = '<i class="fa-solid fa-arrow-up text-amber-400 text-2xl mb-1"></i>';
                    feedbackText.innerHTML = `عدد مخفی <span class="text-amber-400 font-bold">بزرگ‌تر</span> از ${userGuess} است! ⬆️`;
                } else {
                    feedbackCard.className = "bg-sky-500/10 border border-sky-500/30 rounded-2xl p-4 text-center transition-all duration-300 flex flex-col items-center justify-center min-h-[90px]";
                    feedbackIcon.innerHTML = '<i class="fa-solid fa-arrow-down text-sky-400 text-2xl mb-1"></i>';
                    feedbackText.innerHTML = `عدد مخفی <span class="text-sky-400 font-bold">کوچک‌تر</span> از ${userGuess} است! ⬇️`;
                }
            }

            guessInput.value = '';
            guessInput.focus();
        }

        // Disable input during game over
        function disableInput() {
            guessInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // Render Guess History List
        function renderHistory() {
            historyCount.textContent = `${guessHistory.length} حدس`;
            if (guessHistory.length === 0) {
                historyList.innerHTML = '<span class="text-xs text-slate-500 italic p-1 w-full text-center">هنوز حدسی ثبت نشده</span>';
                return;
            }

            historyList.innerHTML = guessHistory.map(item => {
                let badgeStyle = "bg-slate-800 text-slate-300 border-slate-700";
                let icon = "";
                if (item.status === 'low') {
                    badgeStyle = "bg-amber-500/15 text-amber-400 border-amber-500/30";
                    icon = '<i class="fa-solid fa-arrow-up text-[10px] mr-1"></i>';
                } else if (item.status === 'high') {
                    badgeStyle = "bg-sky-500/15 text-sky-400 border-sky-500/30";
                    icon = '<i class="fa-solid fa-arrow-down text-[10px] mr-1"></i>';
                } else {
                    badgeStyle = "bg-emerald-500/20 text-emerald-400 border-emerald-500/40 font-bold";
                    icon = '<i class="fa-solid fa-check text-[10px] mr-1"></i>';
                }

                return `<span class="inline-flex items-center px-2.5 py-1 rounded-lg border text-xs font-semibold ${badgeStyle}">
                    ${item.guess} ${icon}
                </span>`;
            }).reverse().join('');
        }

        // Confetti Celebration Effect
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        // Event Listeners
        submitBtn.addEventListener('click', handleGuess);

        guessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleGuess();
        });

        resetBtn.addEventListener('click', () => {
            playSound('click');
            initGame();
        });

        // Plus / Minus Buttons
        incrementBtn.addEventListener('click', () => {
            playSound('click');
            let val = parseInt(guessInput.value) || 0;
            if (val < maxRange) guessInput.value = val + 1;
        });

        decrementBtn.addEventListener('click', () => {
            playSound('click');
            let val = parseInt(guessInput.value) || 0;
            if (val > 1) guessInput.value = val - 1;
        });

        // Range Selection Buttons
        rangeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                playSound('click');
                rangeBtns.forEach(b => {
                    b.classList.remove('active', 'border-2', 'border-brand-500', 'bg-brand-500/20', 'text-brand-500');
                    b.classList.add('border', 'border-slate-600', 'bg-slate-700/50');
                });

                btn.classList.add('active', 'border-2', 'border-brand-500', 'bg-brand-500/20', 'text-brand-500');
                btn.classList.remove('border', 'border-slate-600', 'bg-slate-700/50');

                maxRange = parseInt(btn.dataset.range);
                maxAttempts = parseInt(btn.dataset.attempts);

                if (maxRange === 50) difficultyDisplay.textContent = 'ساده';
                else if (maxRange === 100) difficultyDisplay.textContent = 'متوسط';
                else difficultyDisplay.textContent = 'سخت';

                initGame();
            });
        });

        // Start Game on Page Load
        window.onload = initGame;
    </script>
</body>
</html>
